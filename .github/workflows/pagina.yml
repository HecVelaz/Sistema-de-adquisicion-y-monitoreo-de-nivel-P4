# Publica la pagina de monitoreo (carpeta web/) en GitHub Pages.
# Solo corre cuando cambia la pagina: los datos no pasan por aqui,
# la pagina los lee de datos.json en la rama "datos".

name: Pagina de monitoreo

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pagina.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: despliegue
        uses: actions/deploy-pages@v4
